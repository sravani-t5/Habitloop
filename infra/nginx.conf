# Local API gateway: mirrors the ALB path-based listener rules used on AWS.
server {
  listen 80;
  location /api/users           { proxy_pass http://user-service:3000; }
  location /api/activities       { proxy_pass http://activity-service:3000; }
  location /api/challenges       { proxy_pass http://challenge-service:3000; }
  location /api/integrations     { proxy_pass http://integration-service:3000; }
  location /api/analytics        { proxy_pass http://analytics-service:3000; }
  location /api/recommendations  { proxy_pass http://recommendation-service:3000; }
  location = /health { return 200 'gateway ok'; add_header Content-Type text/plain; }
}
